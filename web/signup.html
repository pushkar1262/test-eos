<!doctype html>
<meta charset="utf-8">
<title>Sign up</title>
<link rel="stylesheet" href="/style.css">

<form id="signup" novalidate>
  <h1>Create your account</h1>

  <label>Name <input name="name"></label>
  <p class="error" data-for="name"></p>

  <label>Email <input name="email"></label>
  <p class="error" data-for="email"></p>

  <label>Password <input name="password" type="password"></label>
  <p class="error" data-for="password"></p>

  <label>Confirm password <input name="confirmPassword" type="password"></label>
  <p class="error" data-for="confirmPassword"></p>

  <button type="submit">Sign up</button>
  <p class="error" data-for="form"></p>
  <p>Already registered? <a href="/login.html">Log in</a>.</p>
</form>

<script>
  const form = document.getElementById("signup");

  // Client-side checks so the user sees the problem next to the field they got
  // wrong. The server re-runs every one of them; this is convenience, not trust.
  function validate({ name, email, password, confirmPassword }) {
    const errors = {};
    if (!name.trim()) errors.name = "Name is required.";
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())) errors.email = "Enter a valid email address.";
    if (password.length < 8) errors.password = "Password must be at least 8 characters.";
    if (confirmPassword !== password) errors.confirmPassword = "Passwords do not match.";
    return errors;
  }

  function show(errors) {
    document.querySelectorAll(".error").forEach((el) => {
      el.textContent = errors[el.dataset.for] || "";
    });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(form));
    const errors = validate(values);
    show(errors);
    if (Object.keys(errors).length) return;

    const response = await fetch("/api/auth/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        name: values.name.trim(),
        email: values.email.trim(),
        password: values.password,
        confirm_password: values.confirmPassword,
      }),
    });

    if (response.status === 201) {
      window.location.href = "/login.html";
    } else if (response.status === 409) {
      show({ email: "That email is already registered." });
    } else {
      show({ form: (await response.json()).detail || "Sign up failed." });
    }
  });
</script>
